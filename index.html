    function cargarArchivo(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          let buffer = evt.target.result;
          let decoder = new TextDecoder('windows-1252');
          let text = decoder.decode(buffer);

          if (file.name.toLowerCase().endsWith('.csv')) {
            const parsed = parsearCSV(text);
            if (parsed.length > 0) {
              rawData = parsed;
              procesarYGeorreferenciar();
            } else {
              alert('El CSV no contiene registros válidos.');
            }
          } else {
            const data = new Uint8Array(buffer);
            const wb = XLSX.read(data, { type: 'array' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            rawData = XLSX.utils.sheet_to_json(sheet, { defval: 'Sin Asignar' });
            procesarYGeorreferenciar();
          }
        } catch (err) {
          alert('Error al procesar el archivo.');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function parsearCSV(text) {
      const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
      if (lines.length < 2) return [];

      const delim = lines[0].includes(';') ? ';' : ',';
      const headers = lines[0].split(delim).map(h => h.replace(/^["']|["']$/g, '').trim());

      const result = [];
      for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(delim).map(v => v.replace(/^["']|["']$/g, '').trim());
        if (values.length >= headers.length) {
          const row = {};
          headers.forEach((h, idx) => {
            row[h] = values[idx] || 'Sin Asignar';
          });
          result.push(row);
        }
      }
      return result;
    }
